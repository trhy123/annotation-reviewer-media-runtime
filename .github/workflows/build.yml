name: Build shared media runtime

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build Windows x64
        required: false
        default: true
        type: boolean
      build_macos_arm64:
        description: Build macOS Apple Silicon (arm64)
        required: false
        default: true
        type: boolean
      build_macos_amd64:
        description: Build macOS Intel (x86-64)
        required: false
        default: true
        type: boolean
      build_linux:
        description: Build Linux x64
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'versions.env'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-amd64:
    name: Windows x64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            make
            diffutils
            pkgconf
            xz
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-yasm
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-fribidi
            mingw-w64-ucrt-x86_64-harfbuzz

      - name: Build shared runtime
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_PATH="$PWD/.work/windows-amd64/deps/lib/pkgconfig:$PWD/.work/windows-amd64/prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          bash scripts/build_runtime.sh windows-amd64

      - name: Create 7z archive
        shell: pwsh
        run: |
          $src = 'dist/media-runtime-windows-amd64'
          $archive = 'dist/media-runtime-windows-amd64.7z'
          if (-not (Test-Path -LiteralPath $src -PathType Container)) {
            throw "Missing runtime directory: $src"
          }
          if (Test-Path -LiteralPath $archive) {
            Remove-Item -LiteralPath $archive -Force
          }
          & 7z a -t7z -mx=9 -m0=LZMA2 -md=64m -mfb=273 -ms=on -mmt=on $archive $src
          if ($LASTEXITCODE -ne 0) { throw "7-Zip failed with exit code $LASTEXITCODE" }
          Get-Item $archive | Select-Object Name, Length

      - name: Upload Windows runtime
        uses: actions/upload-artifact@v7
        with:
          name: media-runtime-windows-amd64.7z
          path: dist/media-runtime-windows-amd64.7z
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  macos-arm64:
    name: macOS Apple Silicon
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos_arm64 }}
    runs-on: macos-15
    timeout-minutes: 180
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      LDFLAGS: '-Wl,-headerpad_max_install_names'
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: brew install bash coreutils meson ninja pkg-config nasm yasm freetype fribidi harfbuzz

      - name: Build shared runtime
        run: |
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          export PKG_CONFIG_PATH="$PWD/.work/macos-arm64/deps/lib/pkgconfig:$PWD/.work/macos-arm64/prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          "$(brew --prefix bash)/bin/bash" scripts/build_runtime.sh macos-arm64

      - name: Create tar.xz archive
        run: tar -cJf dist/media-runtime-macos-arm64.tar.xz -C dist media-runtime-macos-arm64

      - name: Upload macOS arm64 runtime
        uses: actions/upload-artifact@v7
        with:
          name: media-runtime-macos-arm64.tar.xz
          path: dist/media-runtime-macos-arm64.tar.xz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  macos-amd64:
    name: macOS Intel
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos_amd64 }}
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      LDFLAGS: '-Wl,-headerpad_max_install_names'
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: brew install bash coreutils meson ninja pkg-config nasm yasm freetype fribidi harfbuzz

      - name: Build shared runtime
        run: |
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          export PKG_CONFIG_PATH="$PWD/.work/macos-amd64/deps/lib/pkgconfig:$PWD/.work/macos-amd64/prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          "$(brew --prefix bash)/bin/bash" scripts/build_runtime.sh macos-amd64

      - name: Create tar.xz archive
        run: tar -cJf dist/media-runtime-macos-amd64.tar.xz -C dist media-runtime-macos-amd64

      - name: Upload macOS Intel runtime
        uses: actions/upload-artifact@v7
        with:
          name: media-runtime-macos-amd64.tar.xz
          path: dist/media-runtime-macos-amd64.tar.xz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  linux-amd64:
    name: Linux x64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            pkg-config \
            ninja-build \
            nasm \
            yasm \
            patchelf \
            xz-utils \
            python3-pip \
            libfreetype6-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libfontconfig1-dev \
            libva-dev \
            libdrm-dev
          python3 -m pip install --user 'meson>=1.3,<2'

      - name: Build shared runtime
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export PKG_CONFIG_PATH="$PWD/.work/linux-amd64/deps/lib/pkgconfig:$PWD/.work/linux-amd64/prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          meson --version
          bash scripts/build_runtime.sh linux-amd64

      - name: Create tar.xz archive
        run: tar -cJf dist/media-runtime-linux-amd64.tar.xz -C dist media-runtime-linux-amd64

      - name: Upload Linux runtime
        uses: actions/upload-artifact@v7
        with:
          name: media-runtime-linux-amd64.tar.xz
          path: dist/media-runtime-linux-amd64.tar.xz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish CI pre-release
    needs:
      - windows-amd64
      - macos-arm64
      - macos-amd64
      - linux-amd64
    if: >-
      ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.build_windows || inputs.build_macos_arm64 || inputs.build_macos_amd64 || inputs.build_linux) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    env:
      BUILD_WINDOWS: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
      BUILD_MACOS_ARM64: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos_arm64 }}
      BUILD_MACOS_AMD64: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos_amd64 }}
      BUILD_LINUX: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux }}
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download runtime artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: media-runtime-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 2 -type f -print
          expected_assets=()
          [[ "${BUILD_WINDOWS}" == "true" ]] && expected_assets+=("release-assets/media-runtime-windows-amd64.7z")
          [[ "${BUILD_MACOS_ARM64}" == "true" ]] && expected_assets+=("release-assets/media-runtime-macos-arm64.tar.xz")
          [[ "${BUILD_MACOS_AMD64}" == "true" ]] && expected_assets+=("release-assets/media-runtime-macos-amd64.tar.xz")
          [[ "${BUILD_LINUX}" == "true" ]] && expected_assets+=("release-assets/media-runtime-linux-amd64.tar.xz")
          if [[ "${#expected_assets[@]}" -eq 0 ]]; then
            echo "No platform selected for release." >&2
            exit 1
          fi
          for asset in "${expected_assets[@]}"; do
            test -f "${asset}"
          done

      - name: Publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="runtime-ci-${GITHUB_RUN_NUMBER}"
          TITLE="Shared media runtime CI #${GITHUB_RUN_NUMBER}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "Automated experimental shared media runtime built from ${GITHUB_SHA}." \
              --prerelease
          fi

          assets=()
          [[ "${BUILD_WINDOWS}" == "true" ]] && assets+=("release-assets/media-runtime-windows-amd64.7z")
          [[ "${BUILD_MACOS_ARM64}" == "true" ]] && assets+=("release-assets/media-runtime-macos-arm64.tar.xz")
          [[ "${BUILD_MACOS_AMD64}" == "true" ]] && assets+=("release-assets/media-runtime-macos-amd64.tar.xz")
          [[ "${BUILD_LINUX}" == "true" ]] && assets+=("release-assets/media-runtime-linux-amd64.tar.xz")
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets found." >&2
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber

      - name: Delete temporary Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[].id' |
          while read -r artifact_id; do
            if [[ -n "$artifact_id" ]]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            fi
          done
