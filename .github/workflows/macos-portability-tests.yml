name: macOS runtime audit source checks

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/macos-portability-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python audit
        run: python3 -m py_compile scripts/verify_macos_runtime.py
      - name: Compile independent libmpv loader test
        run: cc -Wall -Wextra -Werror tests/mpv_dlopen_smoke.c -o /tmp/mpv_dlopen_smoke
      - name: Check shell script syntax
        run: bash -n scripts/build_runtime.sh scripts/bundle_runtime.sh
